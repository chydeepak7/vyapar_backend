services:
  - type: web
    name: vyapar-backend
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn vyapar_project.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "vyapar-backend.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://vyaparappnarayani.vercel.app"
      - key: DATABASE_URL
        fromDatabase:
          name: vyapar-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.10.0"

databases:
  - name: vyapar-db
    plan: free
